name: build

# 整个测试套件，在每次 push 和 pull request 上运行。
#
# 正是这个文件让测试套件有任何意义。没有它，测试通过的唯一证据就是最后跑它们的人的一句话，贡献者也没法
# 在开 pull request 之前知道自己的改动有没有弄坏什么。数量刻意不写进任何地方：每加一个测试它就会漂移，
# 而注释里一个过期的数字比没有数字更糟——README 上方那个 badge 才是实时的答案。
#
# 刻意跑两个平台：shell 工具硬编码 /bin/bash，启动器用到 readlink，所以受支持的目标是 POSIX 系统——
# 而在 Linux 和 macOS 上都跑，才让这句话是事实而不是愿望。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 两个平台的结果都要，而不只是第一个失败：知道 macOS 通过而 Linux 失败，就是平台 bug 和真 bug
      # 之间的区别。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 浏览器用例（src/test/js/*.mjs）在 node 下运行，并被接进 JUnit 套件。没有 node 时它们被报告
      # 为*跳过*而不是通过，所以一次没有 node 的构建会显示绿灯却一点页面都没测——这里装上运行时，就是
      # 为了让这件事不会在 CI 里静默发生。
      #
      # 22 是那条真浏览器冒烟（WebBrowserSmokeTest）的地板：它用 node 自带的 WebSocket 说 CDP，而那
      # 个全局对象要 22.4 才有。按 20 装的话，那个用例会在两个平台上都记成*跳过*——一台机器跳过一次
      # 冒烟是它该做的事，而每一台机器都跳过一次冒烟，就只是一次没人测过页面。
      - name: 设置 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 走 wrapper 而不是裸的 `mvn`：wrapper 钉住 Maven 版本，所以这里的构建和贡献者拿到的是同一个
      # 构建。
      - name: 构建并测试
        run: ./mvnw -B -ntp verify

      # 用户下载的就是这个 jar，所以构建必须证明它能产出一个。
      - name: 打包出的 jar 能启动
        run: |
          ./mvnw -B -ntp -DskipTests package
          java -jar target/ccj.jar --version

      # 失败时把「哪条测试、为什么」直接打进日志。surefire 的报告只在磁盘上，而 Maven 的输出在几十行
      # 之上——一个私有仓库的日志唯一的读者是人，所以让它自己说出结论，比让人去下载 artifact 再翻文件强。
      - name: 失败的测试
        if: failure()
        run: |
          shopt -s nullglob
          for report in target/surefire-reports/*.txt; do
            if grep -qE '<<< (FAILURE|ERROR)' "$report"; then
              echo "===== $report"
              cat "$report"
            fi
          done

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: ignore
