name: build

# 整个测试套件，在每次 push 和 pull request 上运行。
#
# 正是这个文件让测试套件有任何意义。没有它，测试通过的唯一证据就是最后跑它们的人的一句话，贡献者也没法
# 在开 pull request 之前知道自己的改动有没有弄坏什么。数量刻意不写进任何地方：每加一个测试它就会漂移，
# 而注释里一个过期的数字比没有数字更糟——README 上方那个 badge 才是实时的答案。
#
# 刻意跑三个平台。Linux 与 macOS 跑**全量**；Windows 跑**不绑定 POSIX 的那部分**（见下面的 windows 作业），
# 而那样分是因为有一类东西在 Windows 上没有对应物：文件权限（`PosixFilePermissions`）与 `/bin/sh`。那些用例
# 带着 `posix` 标签，由 `-DexcludedGroups=posix` 排除——**具名排除**，而不是让它们静默跳过：一个"跳过"看起来
# 和通过一模一样，而这里要的是"哪些东西没在 Windows 上跑"是一份写下来的名单。
#
# 这个作业还是 2.5 那句"shell 是可配置的"的证据。那份声明在它写下的那天是**没有人验证过**的：Windows 上跑
# 一次才算数，而 ShellFromConfigTest 打印的那两行就是"跑过了"。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 两个平台的结果都要，而不只是第一个失败：知道 macOS 通过而 Linux 失败，就是平台 bug 和真 bug
      # 之间的区别。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # 把 ~/.m2 缓存起来。没有它，每个 runner 都从零下载整个插件闭包（上百个 artifact），而
          # 每一次下载都是一次撞上网络抖动的机会——2026-09-21 那次 macOS 失败正是这样：ubuntu 在同一个
          # 提交上绿了、本机连跑两遍也绿，红的却是 `Failed to read artifact descriptor for
          # org.codehaus.plexus:plexus-java:jar:1.5.2`，也就是一次下载读失败了，跟代码无关。
          cache: maven

      # 浏览器用例（src/test/js/*.mjs）在 node 下运行，并被接进 JUnit 套件。没有 node 时它们被报告
      # 为*跳过*而不是通过，所以一次没有 node 的构建会显示绿灯却一点页面都没测——这里装上运行时，就是
      # 为了让这件事不会在 CI 里静默发生。
      #
      # 22 是那条真浏览器冒烟（WebBrowserSmokeTest）的地板：它用 node 自带的 WebSocket 说 CDP，而那
      # 个全局对象要 22.4 才有。按 20 装的话，那个用例会在两个平台上都记成*跳过*——一台机器跳过一次
      # 冒烟是它该做的事，而每一台机器都跳过一次冒烟，就只是一次没人测过页面。
      - name: 设置 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 走 wrapper 而不是裸的 `mvn`：wrapper 钉住 Maven 版本，所以这里的构建和贡献者拿到的是同一个
      # 构建。
      - name: 构建并测试
        run: ./mvnw -B -ntp verify

      # 用户下载的就是这个 jar，所以构建必须证明它能产出一个。
      - name: 打包出的 jar 能启动
        run: |
          ./mvnw -B -ntp -DskipTests package
          java -jar target/ccj.jar --version

      # 失败时把「哪条测试、为什么」直接打进日志。surefire 的报告只在磁盘上，而 Maven 的输出在几十行
      # 之上——日志唯一的读者是人，所以让它自己说出结论，比让人去下载 artifact 再翻文件强。
      - name: 失败的测试
        if: failure()
        run: |
          shopt -s nullglob
          for report in target/surefire-reports/*.txt; do
            if grep -qE '<<< (FAILURE|ERROR)' "$report"; then
              echo "===== $report"
              cat "$report"
            fi
          done

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: ignore


  # Windows：只跑不绑定 POSIX 的那部分。
  #
  # 这是 4.6 要的那份证据。它跑不了全量，而它**不假装**跑得了：`posix` 那一组被具名排除，名单在代码里
  # （`@Tag("posix")`），不在这个文件里。
  windows:
    name: windows（不绑定 POSIX 的那部分）
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 与另外两个平台同理：浏览器用例（src/test/js/*.mjs）在 node 下跑，没有 node 时它们被报告为*跳过*，
      # 而一次"跳过"不能看起来像一次通过。
      - name: 设置 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 真浏览器那一条不在 Windows 上跑：它要一个真的 Chromium 与 CDP 的引导，而那条路只在 Linux 与 macOS
      # 上被验证过（它是 `--excludedGroups` 排除不掉的东西，所以按名字排除）。
      - name: 构建并测试（具名排除 posix 那一组）
        run: .\mvnw.cmd -B -ntp "-DexcludedGroups=posix" "-Dtest=!WebBrowserSmokeTest" test

      # 那就是"一个回合跑起来了，shell 来自配置"：一个真实的 CLI 回合（--demo 只关掉模型），而它打印的两行
      # 被这一步找出来——找不到就让作业失败，因为一句没人检查过的证据与没有证据是一回事。
      - name: 证据——一个回合跑起来了，shell 来自配置
        run: |
          .\mvnw.cmd -B -ntp -Dtest=ShellFromConfigTest test | Tee-Object -FilePath evidence.txt
          if (-not (Select-String -Quiet -Path evidence.txt -Pattern 'CI 证据')) {
            throw "日志里没有那条证据"
          }

      - name: 失败的测试
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem target/surefire-reports/*.txt | ForEach-Object {
            if (Select-String -Quiet -Path $_.FullName -Pattern '<<< (FAILURE|ERROR)') {
              Write-Output ("===== " + $_.Name)
              Get-Content $_.FullName | Write-Output
            }
          }

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-windows
          path: target/surefire-reports/
          if-no-files-found: ignore

  # 镜像这一条是分开的一个作业，而不是主机测试里多一步：它要的是另一个工具链（Docker），而且它与平台矩阵
  # 无关——一个镜像要么能起来，要么不能。
  #
  # 它证明的不是「Dockerfile 语法正确」，而是「这个镜像真的能起一个服务器并回答一个问题」：先构建，再起一个
  # 容器，再对它做一次真的 HTTP 请求。没有这一步，Dockerfile 就是一份**没有人跑过**的声明——而这个仓库对
  # 那种东西的名字，是「负债」。
  docker:
    name: docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 构建阶段会跑 `mvn package`，所以要一个 JDK 的只是那个镜像里自带的 Maven，不是 runner 上的。
      - name: 构建镜像
        run: docker build -t ccj:ci .

      - name: 起一个容器并问它一句
        run: |
          # 覆盖 CMD 时要连着默认的那几个 flag 一起给：容器里没有浏览器可开，而环回对宿主机没有意义。
          docker run -d --name ccj-ci -p 6767:6767 ccj:ci --demo --no-open --host 0.0.0.0 --port 6767
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:6767/api/status >/dev/null 2>&1; then
              echo "服务器起来了（第 ${attempt} 次尝试）"
              break
            fi
            sleep 1
          done
          # 一次真的请求：没有它，「镜像能构建」和「镜像能用」是两件事。
          curl -fsS http://127.0.0.1:6767/api/status | head -c 300
          echo

      - name: 容器里的日志
        if: failure()
        run: docker logs ccj-ci || true

      - name: 收尾
        if: always()
        run: docker rm -f ccj-ci || true
