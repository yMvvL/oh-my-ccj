name: 功能请求
description: ccj 应该做而没做的事。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先读 [CONTRIBUTING.md](../../blob/main/CONTRIBUTING.md)——MCP、插件、沙箱和多用户账号是刻意
        不在范围内的，原因都写在那里。

  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: |
        你想做什么，在哪里出了问题。一个具体的情境比一个抽象的能力好处理得多：「我想要 X，结果得手动
        做 Y」比「请加一个 X 工具」说明了更多。
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你心里想的样子
      description: 可选。如果你心里有个形状，说出来——但上面的问题更重要。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代办法
      description: 现有的 flag、配置，或者换个做法。有时候答案本来就在那儿。
    validations:
      required: false
