name: Bug 报告
description: 有东西的行为和 README 或某条注释说的不一样。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **不要粘贴 API 密钥。** 如果它出现在你正要发出的输出里，先轮换它。

        安全问题走 [SECURITY.md](../../blob/main/SECURITY.md)，不是这里。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 你期望什么，结果得到了什么。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现
      description: 确切的步骤或命令。一份复现比一段描述更值钱。
      placeholder: |
        1. `./ccj --repl`
        2. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: 输出
      description: |
        确切的输出，包括任何错误。如果是会话相关的问题，`~/.oh-my-ccj/sessions/<id>.jsonl` 里相关
        的那几行——每条消息和命令都逐字记在那里。
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: `./ccj --version` 的输出。
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Linux
        - macOS
        - WSL
        - 其它（请说明是哪个）
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: 提供方和模型
      description: 它们之间的行为差异大到会影响判断。
      placeholder: openai / gpt-4o-mini
    validations:
      required: false
