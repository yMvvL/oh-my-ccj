<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>ccj</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">ccj</span>
      <span id="conn-pill" class="conn-pill" hidden>reconnecting…</span>
    </div>

    <div class="meta" id="meta">
      <span class="chip" id="chip-provider" title="provider">provider</span>
      <span class="chip" id="chip-model" title="model">model</span>
      <span class="chip chip-url" id="chip-baseurl" title="base URL">base URL</span>
      <span class="chip chip-session" id="chip-session" title="session">no session</span>
    </div>

    <div class="live" id="live" data-state="idle">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="live-text">idle</span>
    </div>

    <div class="actions">
      <button type="button" class="btn" id="btn-new">New session</button>
      <button type="button" class="btn" id="btn-sessions" aria-haspopup="dialog">Sessions</button>
      <button type="button" class="btn toggle" id="btn-auto" aria-pressed="false">
        <span class="switch" aria-hidden="true"></span>
        <span>Approve all</span>
        <span class="toggle-state" id="auto-state">off</span>
      </button>
      <button type="button" class="btn" id="btn-settings" aria-haspopup="dialog">Settings</button>
      <button type="button" class="btn danger" id="btn-abort" disabled>Abort</button>
      <button type="button" class="btn ghost" id="btn-side" aria-expanded="true" aria-controls="side" title="Toggle side panel">Panel</button>
    </div>
  </header>

  <div id="layout">
    <main id="main">
      <div id="transcript" class="transcript" aria-live="polite" aria-relevant="additions text">
        <p class="muted placeholder">Connecting to ccj…</p>
      </div>

      <form id="composer" class="composer" autocomplete="off">
        <button type="button" id="jump" class="jump" hidden>jump to latest</button>
        <label class="sr-only" for="input">Message</label>
        <textarea id="input" rows="3" spellcheck="false"
                  placeholder="Message the agent — Enter sends, Shift+Enter adds a newline"></textarea>
        <div class="composer-row">
          <span class="hint" id="composer-hint"></span>
          <button type="submit" id="send" class="btn primary">Send</button>
        </div>
      </form>
    </main>

    <aside id="side" class="side" aria-label="Agent details">
      <section class="side-sec">
        <h2>Tools</h2>
        <ul class="tool-list" id="tool-list">
          <li class="muted">No tools reported.</li>
        </ul>
      </section>
      <section class="side-sec">
        <h2>Usage</h2>
        <div class="usage" id="usage">—</div>
      </section>
      <section class="side-sec">
        <h2>Session</h2>
        <div class="kv" id="session-info">—</div>
      </section>
    </aside>
  </div>
</div>

<div id="sessions-overlay" class="overlay" hidden>
  <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="sessions-title">
    <header class="overlay-head">
      <h2 id="sessions-title">Sessions</h2>
      <button type="button" class="btn ghost" id="sessions-close">Close</button>
    </header>
    <div class="overlay-body" id="sessions-body">
      <p class="muted">Loading…</p>
    </div>
  </div>
</div>

<div id="settings-overlay" class="overlay" hidden>
  <div class="overlay-card settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <header class="overlay-head">
      <h2 id="settings-title">Settings</h2>
      <button type="button" class="btn ghost" id="settings-close">Close</button>
    </header>

    <form class="overlay-body settings-body" id="settings-form" autocomplete="off">
      <p class="err settings-error" id="settings-error" hidden></p>

      <div class="field">
        <label for="cfg-provider">Provider</label>
        <select id="cfg-provider"></select>
      </div>

      <div class="field">
        <label for="cfg-model">Model</label>
        <input type="text" id="cfg-model" spellcheck="false" placeholder="gpt-4o-mini">
        <span class="field-error" id="cfg-model-error" hidden></span>
      </div>

      <div class="field">
        <label for="cfg-baseurl">Base URL</label>
        <input type="text" id="cfg-baseurl" spellcheck="false" placeholder="https://api.openai.com/v1">
      </div>

      <div class="field">
        <label for="cfg-apikey">API key</label>
        <input type="password" id="cfg-apikey" autocomplete="new-password" spellcheck="false">
        <span class="field-hint" id="cfg-apikey-hint" hidden></span>
        <span class="field-error" id="cfg-apikey-error" hidden></span>
        <label class="field-check" id="cfg-clearkey-wrap" hidden>
          <input type="checkbox" id="cfg-clearkey">
          <span>clear stored key</span>
        </label>
      </div>

      <div class="field">
        <label for="cfg-apikeyenv">API key env var</label>
        <input type="text" id="cfg-apikeyenv" spellcheck="false" placeholder="OPENAI_API_KEY">
        <span class="field-hint" id="cfg-apikeyenv-hint" hidden></span>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="cfg-maxsteps">Max steps</label>
          <input type="number" id="cfg-maxsteps" min="1" step="1" placeholder="25">
        </div>
        <div class="field">
          <label for="cfg-temperature">Temperature</label>
          <input type="number" id="cfg-temperature" min="0" max="2" step="any" placeholder="default">
        </div>
      </div>

      <p class="settings-test-result" id="settings-test-result" hidden></p>

      <div class="settings-actions">
        <button type="button" class="btn" id="settings-test">Test connection</button>
        <span class="hint" id="settings-test-hint">Sends one tiny request to the provider using these values. Nothing is saved.</span>
        <button type="submit" class="btn primary" id="settings-save">Save</button>
      </div>

      <p class="settings-foot" id="settings-foot"></p>
    </form>
  </div>
</div>

<noscript><p class="noscript">ccj --web needs JavaScript.</p></noscript>

<script src="/app.js" defer></script>
</body>
</html>
